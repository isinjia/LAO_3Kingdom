<!doctype html>
<!-- 야전 밸런스 시뮬레이터 (브라우저판, node가 없을 때) — tools/field_sim.js 와 같은 규칙.
     사용: http://localhost:8000/tools/field_sim.html?n=30&seed=7  → 결과가 화면과 window.SIM 에 나온다
     &form=counter (공격측이 늘 상성 우위 진형) · &form=weak (늘 상성 열세) — 진형 상성의 영향 측정 -->
<meta charset="utf-8">
<title>야전 시뮬레이터</title>
<style>body { background: #111; color: #ddd; font: 13px/1.5 monospace; padding: 16px; } b { color: #ffd36a; }</style>
<pre id="out">실행 중…</pre>
<script>
  const Q = new URLSearchParams(location.search), N = +(Q.get("n") || 20), POLICY = Q.get("form") || ""; let seed = +(Q.get("seed") || 7);
  Math.random = () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; };
  var Sound = { voice() {}, sfx() {}, bgm() {}, charSfx() {}, stopBgm() {} };
  var UI = { banner() {}, cutin: () => Promise.resolve() };
</script>
<script src="../js/lao_official.js"></script><script src="../js/data.js"></script><script src="../js/city_bg.js"></script>
<script src="../js/equip_data.js"></script><script src="../js/skills_data.js"></script><script src="../js/lines_data.js"></script>
<script src="../js/lines_peer.js"></script><script src="../js/game.js"></script><script src="../js/equip.js"></script>
<script src="../js/events.js"></script><script src="../js/battle.js"></script><script src="../js/field.js"></script>
<script>
  FUI.stage = null; FUI.log = () => {}; FUI.pop = () => {}; FUI.flash = () => {}; FUI.shake = () => {}; FUI.toast = () => {}; FUI.skName = () => {};
  const keys = Object.keys(FORMS);
  function runOne(seedIdx) {
    newGame(["BR_Marie", "3P_Labiata", "BR_Leona", "PECS_Empress", "3P_Alice"][seedIdx % 5], {});
    const p = P();
    const to = neighbors(p.city).map(C).find((c) => c.owner && c.owner !== p.fac) || neighbors(p.city).map(C)[0];
    const atk = unitsIn(p.city).filter((u) => u.fac === p.fac).slice(0, 4).map((u) => ({ u, troops: Math.min(maxTroops(u), 4000) }));
    const war = prepareBattle({ atkFac: p.fac, from: p.city, to: to.name, atk });
    const F_ = Field;
    F_.sim = true;
    F_.setup({ war, playerSide: "def", commander: false });
    F_.ctrl = () => false; F_.autoSkill = true;
    const dk = keys[(seedIdx * 5 + 1) % keys.length]; F_.form = { atk: POLICY === "counter" ? formWinner(dk) : POLICY === "weak" ? formLoser(dk) : keys[seedIdx % keys.length], def: dk };
    let result = null;
    F_.finish = (win, why) => { if (!result) result = { win, why, t: F_.t }; F_.finished = true; };
    F_.build();
    let casts = 0;
    const cast0 = Field.__cast || (Field.__cast = Field.cast);
    F_.cast = function (g, i, m) { const ok = cast0.call(F_, g, i, m); if (ok) casts++; return ok; };
    const live = (s) => F_.groups.filter((g) => g.side === s).reduce((a, g) => a + g.soldiers.filter((x) => x.alive).length, 0), snap = {};
    for (let i = 0; i < 20000 && !F_.finished; i++) { F_.step(0.05); if (i % 400 === 399) snap[Math.round(F_.t)] = live("atk") + "/" + live("def"); }
    const sum = (arr) => arr.filter((b) => !b.out).reduce((s, b) => s + b.troops, 0);
    const fled = F_.groups.reduce((a, g) => a + g.soldiers.filter((s) => s.gone).length, 0), total = F_.groups.reduce((a, g) => a + g.n0, 0);
    return { win: result ? result.win : null, why: result ? result.why : "timeout", t: Math.round(result ? result.t : F_.t), atkStart: F_.units.atk.reduce((s, b) => s + b.max, 0), defStart: F_.units.def.reduce((s, b) => s + b.max, 0), atkLeft: sum(F_.units.atk), defLeft: sum(F_.units.def), forms: F_.form.atk + "/" + F_.form.def, casts, fled, total, snap };
  }
  const R = []; const lines = [];
  for (let i = 0; i < N; i++) { const r = runOne(i); R.push(r); lines.push(`${r.win ? "공격 승" : "수비 승"} ${String(r.t).padStart(4)}초 · ${r.forms.padEnd(13)} 공격 ${r.atkLeft}/${r.atkStart} · 수비 ${r.defLeft}/${r.defStart} · 무장기 ${r.casts} · 탈주 ${r.fled}/${r.total} · ${r.why} · 병사(공/수) ${Object.entries(r.snap).map(([t, v]) => t + "초 " + v).join(", ")}`); }
  const ts = R.map((r) => r.t).sort((a, b) => a - b), med = (a) => a.slice().sort((x, y) => x - y)[Math.floor(a.length / 2)];
  const S = { median: ts[Math.floor(ts.length / 2)], min: ts[0], max: ts[ts.length - 1], atkWin: Math.round(R.filter((r) => r.win).length / R.length * 100), castMed: med(R.map((r) => r.casts)), fledPct: Math.round(R.reduce((a, r) => a + r.fled, 0) / R.reduce((a, r) => a + r.total, 0) * 100) };
  lines.push(`\n<b>전투 시간 중앙값 ${S.median}초 (최소 ${S.min} · 최대 ${S.max}) · 공격 승률 ${S.atkWin}% · 무장기 중앙값 ${S.castMed}회 · 탈주 비율 ${S.fledPct}%</b>`);
  document.getElementById("out").innerHTML = lines.join("\n");
  window.SIM = { S, R };
</script>
